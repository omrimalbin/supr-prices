name: מחירים מישראל

# רץ על המחשב בבית (self-hosted runner עם התווית israel).
# כשהמחשב כבוי – ההרצה ממתינה בתור עד שיידלק (או מתבטלת אחרי 24 שעות, בלי נזק).
on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:

concurrency:
  group: israel
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: [self-hosted, israel]
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: הכנת Python
        shell: cmd
        run: |
          if not defined PRICES_PYTHON set PRICES_PYTHON=py -3
          if not exist "%RUNNER_TOOL_CACHE%\pricesvenv\Scripts\python.exe" %PRICES_PYTHON% -m venv "%RUNNER_TOOL_CACHE%\pricesvenv"
          set PIP="%RUNNER_TOOL_CACHE%\pricesvenv\Scripts\python.exe" -m pip install -q -U --timeout 60 --retries 10 il-supermarket-scraper
          %PIP% || (ping -n 31 127.0.0.1 >nul & %PIP%) || (ping -n 91 127.0.0.1 >nul & %PIP%)
          if errorlevel 1 exit /b 1
          "%RUNNER_TOOL_CACHE%\pricesvenv\Scripts\python.exe" -m playwright install chromium || ver > nul
      - name: שאיבת הרשתות החסרות
        shell: cmd
        run: '"%RUNNER_TOOL_CACHE%\pricesvenv\Scripts\python.exe" israel.py'
      - uses: actions/upload-artifact@v4
        with:
          name: israel-data
          path: israel/israel.json
          retention-days: 30
