name: פרסום מהיר של האפליקציה

# שינוי במסך בלבד (תיקייה web/) – מפרסם תוך דקה, בלי לשאוב מחדש את המחירים.
# לוקח את הנתונים האחרונים מענף data ומחליף רק את קובצי האפליקציה.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  # אחרי כל עדכון מחירים – מפרסם שוב את קובצי המסך העדכניים מ-main,
  # כדי שעדכון שהתחיל לפני שינוי עיצוב לא ידרוס אותו בגרסה ישנה
  workflow_run:
    workflows: ["עדכון מחירים"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-fast
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: נתונים אחרונים + קובצי האפליקציה החדשים
        run: |
          git fetch --depth 1 origin data
          mkdir site
          git --work-tree=site checkout origin/data -- .
          git reset -q
          cp web/* site/
          ls site site/data | head -30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # פרסום אחד בכל פעם (עדכון מחירים ופרסום מהיר) – אחרת GitHub דוחה פרסום כשאחר עוד רץ
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
