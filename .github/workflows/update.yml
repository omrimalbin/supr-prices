name: עדכון מחירים

on:
  schedule:
    - cron: "17 */6 * * *"   # כל 6 שעות
  workflow_run:
    workflows: ["מחירים מישראל"]
    types: [completed]
  issues:                     # בקשה מהאפליקציה: issue בשם "עיר: נס ציונה | 10"
    types: [opened]
  workflow_dispatch:
    inputs:
      city:
        description: "עיר להוספה (לא חובה)"
        required: false
        default: ""

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    # issue רק מבעל המאגר ורק בפורמט "עיר: ..."
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, 'עיר:') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: התקנה
        run: |
          pip install -U il-supermarket-scraper
          python -m playwright install --with-deps chromium || true
      - name: בקשה מהאפליקציה (עיר חדשה / רדיוס)
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          city=$(python3 -c "import os;print(os.environ['ISSUE_TITLE'].split(':',1)[1].strip())")
          echo "NEW_CITY=$city" >> "$GITHUB_ENV"
          echo "ONLY_NEW=1" >> "$GITHUB_ENV"
          git fetch -q --depth 1 origin data && mkdir -p prev && git --work-tree=prev checkout origin/data -- . && git reset -q || true
      - name: נתונים מהמחשב בבית (רשתות שחסומות מחו"ל)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=israel-data&per_page=1" --jq '.artifacts[0].workflow_run.id // empty' || true)
          if [ -n "$id" ]; then gh run download "$id" -n israel-data -D israel || true; fi
          ls -la israel 2>/dev/null || echo "אין עדיין נתונים מהבית"
      - name: קובצי המסך העדכניים ביותר (אם עודכנו בזמן שההרצה רצה)
        run: git fetch -q origin main && git checkout origin/main -- web/ || true
      - name: שאיבת מחירים ובניית האתר
        env:
          SKIP_CHAINS: HAZI_HINAM,VICTORY_NEW_SOURCE,YAYNO_BITAN_AND_CARREFOUR,MAHSANI_ASHUK_NEW_SOURCE,SUPER_PHARM,NETIV_HASED,HET_COHEN_NEW_SOURCE
          NEW_CITY: ${{ github.event.inputs.city || env.NEW_CITY }}
        run: python build.py
      - name: שמירת רשימת הערים
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add cities.txt geo_cache.json
          git diff --cached --quiet || (git commit -qm "עדכון ערים ומיקומים" && git pull -q --rebase && git push -q)
      - name: עותק נתונים בענף data
        run: |
          cd site
          git init -q -b data
          git add -A
          git -c user.name=prices-bot -c user.email=prices-bot@users.noreply.github.com commit -qm "data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # פרסום אחד בכל פעם (עדכון מחירים ופרסום מהיר) – אחרת GitHub דוחה פרסום כשאחר עוד רץ
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    if: always() && github.event_name == 'issues' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$RESULT" = "success" ]; then msg="✅ מוכן – פתחו את האפליקציה מחדש."; else msg="❌ משהו נכשל. פרטים: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$msg"
