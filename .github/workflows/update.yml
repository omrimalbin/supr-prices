name: עדכון מחירים

on:
  schedule:
    - cron: "17 */6 * * *"   # כל 6 שעות
  workflow_dispatch:
    inputs:
      city:
        description: "עיר להוספה (לא חובה)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: התקנה
        run: |
          pip install -U il-supermarket-scraper
          python -m playwright install --with-deps chromium || true
      - name: שאיבת מחירים ובניית האתר
        env:
          NEW_CITY: ${{ github.event.inputs.city }}
        run: python build.py
      - name: שמירת רשימת הערים
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add cities.txt
          git diff --cached --quiet || (git commit -m "הוספת עיר" && git push)
      - name: עותק נתונים בענף data
        run: |
          cd site
          git init -q -b data
          git add -A
          git -c user.name=prices-bot -c user.email=prices-bot@users.noreply.github.com commit -qm "data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
