<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מחירי סופר">
<meta name="theme-color" content="#1f6f5c">
<title>מחירי סופר</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e0d8;--accent:#1f6f5c;--soft:#e3f1ec;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#151513;--card:#1e1e1b;--ink:#ecebe6;--muted:#9b9a93;--line:#33322e;--accent:#5cc3a6;--soft:#1d3a32;--err:#f2b8b5}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center}
select,input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
select{width:auto;flex:1}
.muted{color:var(--muted);font-size:13px}
main{padding:10px 12px 90px;max-width:700px;margin:0 auto}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:10px}
.name{font-weight:600}.price{font-weight:700;color:var(--accent);font-size:18px;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.bc{font-family:ui-monospace,monospace;unicode-bidi:plaintext}
.det{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.det div{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.det div:first-child{color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.more{display:block;width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.err{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--err)}
a{color:var(--accent)}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:16px;max-width:668px;margin:0 auto;text-align:center;background:var(--accent);color:#fff;text-decoration:none;border-radius:14px;padding:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#install{display:none;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;align-items:center;gap:10px;justify-content:space-between}
#install button{font:inherit;font-weight:600;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px}
#install .x{background:none;color:var(--muted);padding:4px 8px}
[hidden]{display:none!important}
body.basket header{position:static}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;text-align:center;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea{font:inherit;font-size:16px;width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical}
.btn{display:block;width:100%;padding:12px;font:inherit;font-weight:600;border:0;border-radius:12px;background:var(--accent);color:#fff;margin-top:8px}
.store{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.store.sel{border:2px solid var(--accent)}
.store .tot{font-size:20px;font-weight:700}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;margin-inline-start:6px}
.line{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.line .q{font-weight:600}.line .p{font-weight:700;white-space:nowrap}
.miss{color:var(--err)}
.swap{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:8px;padding:3px 9px;margin-top:6px}
.lock{font-size:12px;color:var(--accent)}
#picker{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}
#picker .sheet{background:var(--bg);width:100%;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
#picker .opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
h3{font-size:16px;margin:14px 0 8px}
</style></head><body>
<header>
  <h1>מחירי סופר</h1>
  <div class="tabs"><span class="tab on" data-t="prod">חיפוש מוצרים</span><span class="tab" data-t="basket">רשימת קניות</span></div>
  <div class="row"><select id="city"></select></div>
  <div class="prodOnly" style="margin-top:8px"><input id="q" type="search" placeholder="חיפוש מוצר או ברקוד…"></div>
  <div class="chips prodOnly" id="sorts">
    <span class="chip on" data-s="name">לפי שם</span><span class="chip" data-s="cheap">הכי זול</span>
    <span class="chip" data-s="gap">הפרש מחירים גדול</span><span class="chip" data-s="n">הכי נפוץ</span>
  </div>
  <div class="muted" id="meta" style="margin-top:6px"></div>
  <div id="install"><span id="installText">להתקין כאפליקציה במסך הבית?</span><span><button id="installBtn">התקנה</button><button class="x" id="installX">✕</button></span></div>
</header>
<main id="list"><div class="muted">טוען…</div></main>
<main id="basket" hidden>
  <textarea id="blist" placeholder="כתבו מוצר בכל שורה, למשל:
חלב
אורז פרסי
ביצים
לחם x2
עגבניות 2 (= 2 ק&quot;ג)
קוטג
שמן 1 ליטר"></textarea>
  <button class="btn" id="bgo">השוואת מחירים</button>
  <div class="muted" style="margin-top:6px">לכל שורה נבחר בכל סניף המוצר המתאים הזול ביותר (לפי מחיר לליטר/ק"ג). אפשר להוסיף כמות (x2) או גודל (1 ליטר). לחיצה על "החלפה" נועלת מוצר מסוים.</div>
  <div id="bres"></div>
</main>
<div id="picker"><div class="sheet" id="psheet"></div></div>
<a class="fab" id="refresh" target="_blank" rel="noopener">רענון עכשיו / הוספת עיר</a>
<script src="match.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const nis=v=>'₪'+Number(v).toFixed(2);
let meta=null,data=null,sort=LS.get('sort','name'),shown=60;

function ago(t){const m=Math.round((Date.now()/1000-t)/60);return m<1?"עכשיו":m<60?`לפני ${m} דקות`:m<1440?`לפני ${Math.round(m/60)} שעות`:`לפני ${Math.round(m/1440)} ימים`;}

async function init(){
  meta=await (await fetch('data/cities.json?'+Date.now())).json();
  if(meta.repo) $('#refresh').href=`https://github.com/${meta.repo}/actions/workflows/update.yml`;
  else $('#refresh').hidden=true;
  setTab(tab);
  $('#city').innerHTML=meta.cities.map(c=>`<option value="${c.slug}">${esc(c.name)}${c.items?` (${c.with_prices} סניפים)`:''}</option>`).join('');
  const saved=LS.get('city','');if(meta.cities.some(c=>c.slug===saved))$('#city').value=saved;
  document.querySelectorAll('#sorts .chip').forEach(ch=>{ch.classList.toggle('on',ch.dataset.s===sort);ch.onclick=()=>{sort=ch.dataset.s;LS.set('sort',sort);document.querySelectorAll('#sorts .chip').forEach(x=>x.classList.toggle('on',x===ch));shown=60;draw();};});
  await loadCity();
}
async function loadCity(){
  const c=meta.cities.find(x=>x.slug===$('#city').value);LS.set('city',c.slug);
  $('#meta').textContent=`עודכן ${ago(meta.updated)}`;
  if(c.error){data=null;$('#list').innerHTML=`<div class="err">לא הצלחתי למצוא את "${esc(c.name)}": ${esc(c.error)}${c.suggestions&&c.suggestions.length?`<br><br><span style="color:var(--ink)">אולי התכוונת ל: <b>${c.suggestions.map(esc).join('</b>, <b>')}</b> – אפשר להוסיף אותה דרך הכפתור למטה.</span>`:''}</div>`;return;}
  $('#list').innerHTML='<div class="muted">טוען…</div>';
  data=await (await fetch(`data/${c.slug}.json?`+Math.floor(meta.updated))).json();
  for(const it of data.items){const p=it[3];it.min=p[0][1];it.max=p[p.length-1][1];it.n=p.length;}
  $('#meta').textContent=`${data.items.length.toLocaleString('he-IL')} מוצרים · ${data.stores.length} סניפים · עודכן ${ago(meta.updated)}`;
  shown=60;draw();
  lastRes=null;selStore=null;if(tab==='basket'&&$('#blist').value.trim())runBasket();
}
function filtered(){
  const q=$('#q').value.trim().toLowerCase();
  let r=q?data.items.filter(it=>it[1].toLowerCase().includes(q)||it[0].includes(q)||(it[2]||'').toLowerCase().includes(q)):data.items.slice();
  const f={name:(a,b)=>a[1].localeCompare(b[1],'he'),cheap:(a,b)=>a.min-b.min,gap:(a,b)=>(b.max-b.min)-(a.max-a.min),n:(a,b)=>b.n-a.n}[sort];
  return r.sort(f);
}
function draw(){
  if(!data)return;
  const r=filtered();
  const st=data.stores;
  $('#list').innerHTML=(r.length?'':'<div class="muted">לא נמצאו מוצרים</div>')+r.slice(0,shown).map((it,i)=>`<div class="item" data-i="${i}">
    <div class="top"><div><div class="name">${esc(it[1]||'(ללא שם)')}</div>
    <div class="sub">${it[2]?esc(it[2])+' · ':''}<span class="bc">${esc(it[0])}</span></div>
    <div class="sub">הכי זול ב${esc(st[it[3][0][0]][0])} – ${esc(st[it[3][0][0]][1])}${it.n>1?` · עד ${nis(it.max)} · ${it.n} סניפים`:''}</div></div>
    <div class="price">${nis(it.min)}</div></div></div>`).join('')
    +(r.length>shown?`<button class="more" id="more">הצגת עוד (${(r.length-shown).toLocaleString('he-IL')})</button>`:'');
  const vis=r.slice(0,shown);
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{
    const ex=el.querySelector('.det');if(ex){ex.remove();return;}
    const it=vis[+el.dataset.i];const d=document.createElement('div');d.className='det';
    d.innerHTML=it[3].map(([s,p])=>`<div><span>${esc(st[s][0])} – ${esc(st[s][1])}</span><span>${nis(p)}</span></div>`).join('');el.appendChild(d);});
  const m=$('#more');if(m)m.onclick=()=>{shown+=100;draw();};
}
$('#city').onchange=loadCity;
let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(()=>{shown=60;draw();},150);};
// ---- רשימת קניות ----
let tab=LS.get('tab','prod'), selStore=null, lastRes=null;
const picks=JSON.parse(LS.get('picks','{}'));
function setTab(t){tab=t;LS.set('tab',t);
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  document.querySelectorAll('.prodOnly').forEach(x=>x.hidden=t!=='prod');
  document.body.classList.toggle('basket',t==='basket');
  $('#list').hidden=t!=='prod'; $('#basket').hidden=t!=='basket'; $('#refresh').hidden=t!=='prod'||!meta||!meta.repo;
  if(t==='basket'&&data&&$('#blist').value.trim()&&!lastRes) runBasket();}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>setTab(x.dataset.t));
$('#blist').value=LS.get('blist','');
$('#blist').oninput=()=>LS.set('blist',$('#blist').value);
$('#bgo').onclick=()=>{selStore=null;runBasket();setTimeout(()=>$('#bres').scrollIntoView({behavior:'smooth'}),50);};
const lines=()=>$('#blist').value.split('\n').map(l=>l.trim()).filter(Boolean);
const keyOf=l=>Match.parseLine(l).text;
function sizeTxt(it){return it[5]==='kg'?'לק"ג':it[4]>0?(it[5]==='u'?it[4]+' יח\'':it[4]>=1000?(it[4]/1000)+(it[5]==='ml'?' ל\'':' ק"ג'):it[4]+(it[5]==='ml'?' מ"ל':' גרם')):'';}
function upTxt(it,p){const u=Match.unitPrice(it,p);if(u==null)return '';return it[5]==='u'?`${nis(u)} ליח'`:it[5]==='ml'?`${nis(u)} לליטר`:`${nis(u)} לק"ג`;}
function runBasket(){
  if(!data){$('#bres').innerHTML='<div class="muted">אין נתונים לעיר הזו</div>';return;}
  const ls=lines(); if(!ls.length){$('#bres').innerHTML='';return;}
  const res=Match.compareBasket(data,ls.map(l=>({line:l,pick:picks[keyOf(l)]})));lastRes=res;
  const n=ls.length;
  if(selStore==null) selStore=res.stores[0].si;
  const mixedTot=res.mixed.reduce((a,b)=>a+(b?b.cost:0),0), mixedFound=res.mixed.filter(Boolean).length;
  let h='<h3>השוואה בין הסניפים</h3>';
  h+=res.stores.map((s,i)=>`<div class="store ${s.si===selStore?'sel':''}" data-si="${s.si}">
     <div class="top"><div><b>${esc(s.name)}</b>${i===0&&s.found===n?'<span class="badge">הכי זול</span>':''}
     <div class="sub ${s.found<n?'miss':''}">${s.found===n?'כל הפריטים קיימים':`חסרים ${n-s.found} מתוך ${n} פריטים`}</div></div>
     <div class="tot">${nis(s.total)}</div></div></div>`).join('');
  h+=`<div class="store ${selStore==='mix'?'sel':''}" data-si="mix"><div class="top"><div><b>סל משולב</b><div class="sub">כל פריט מהסניף הכי זול בשבילו${mixedFound<n?` · חסרים ${n-mixedFound}`:''}</div></div><div class="tot">${nis(mixedTot)}</div></div></div>`;
  const rows=selStore==='mix'?res.mixed:res.stores.find(s=>s.si===selStore).rows;
  const title=selStore==='mix'?'סל משולב':res.stores.find(s=>s.si===selStore).name;
  h+=`<h3>הפירוט – ${esc(title)}</h3>`;
  h+=res.parsed.map((p,i)=>{const r=rows[i];const locked=!!picks[keyOf(p.line)];
    if(!r) return `<div class="line"><div class="q">${esc(p.line)}</div><div class="sub miss">${p.cands.length?'לא נמכר בסניף הזה':'לא נמצא מוצר מתאים – נסו לנסח אחרת'}</div><button class="swap" data-i="${i}">בחירת מוצר</button></div>`;
    const it=r.it;
    return `<div class="line"><div class="top"><div><div class="q">${esc(p.line)}</div>
      <div>${esc(it[1])}</div><div class="sub">${esc([sizeTxt(it),upTxt(it,r.price)].filter(Boolean).join(' · '))}${selStore==='mix'?' · '+esc(data.stores[r.si].join(' – ')):''}</div>
      ${locked?'<div class="lock">🔒 מוצר נעול</div>':''}</div><div class="p">${nis(r.cost)}</div></div>
      <button class="swap" data-i="${i}">החלפה</button></div>`;}).join('');
  $('#bres').innerHTML=h;
  document.querySelectorAll('.store').forEach(el=>el.onclick=()=>{selStore=el.dataset.si==='mix'?'mix':+el.dataset.si;runBasket();});
  document.querySelectorAll('.swap').forEach(b=>b.onclick=()=>openPicker(+b.dataset.i));
}
function openPicker(i){
  const p=lastRes.parsed[i], key=keyOf(p.line);
  const auto=Match.candidates(data.items,p.q);
  let pool=auto.length?auto:Match.candidates(data.items,{...p.q,size:0});
  const cheapest=it=>{let b=null;for(const [s,pr] of it[3]) if(!b||pr<b[1]) b=[s,pr];return b;};
  pool=pool.map(it=>({it,c:cheapest(it)})).sort((a,b)=>(Match.unitPrice(a.it,a.c[1])??a.c[1]*1000)-(Match.unitPrice(b.it,b.c[1])??b.c[1]*1000)).slice(0,40);
  $('#psheet').innerHTML=`<div class="top"><b>${esc(p.line)}</b><button class="swap" id="pclose">סגירה</button></div>
    <input id="psearch" type="search" placeholder="חיפוש מוצר אחר…" style="margin:10px 0">
    <div class="opt" data-b=""><b>אוטומטי</b><div class="sub">הכי זול שמתאים, בכל סניף בנפרד</div></div><div id="popts"></div>`;
  const draw=list=>{$('#popts').innerHTML=list.map(({it,c})=>`<div class="opt" data-b="${esc(it[0])}"><div class="top"><div>${esc(it[1])}<div class="sub">${esc([sizeTxt(it),upTxt(it,c[1]),'הכי זול ב'+data.stores[c[0]][0]].filter(Boolean).join(' · '))}${picks[key]===it[0]?' · 🔒 נבחר':''}</div></div><div class="p">${nis(c[1])}</div></div></div>`).join('')||'<div class="muted">אין תוצאות</div>';
    document.querySelectorAll('#picker .opt').forEach(o=>o.onclick=()=>{if(o.dataset.b)picks[key]=o.dataset.b;else delete picks[key];LS.set('picks',JSON.stringify(picks));$('#picker').style.display='none';runBasket();});};
  draw(pool);
  $('#psearch').oninput=()=>{const t=$('#psearch').value.trim();if(!t){draw(pool);return;}
    const r=Match.candidates(data.items,Match.parseLine(t)).map(it=>({it,c:cheapest(it)})).sort((a,b)=>a.c[1]-b.c[1]).slice(0,40);draw(r);};
  $('#pclose').onclick=()=>$('#picker').style.display='none';
  $('#picker').onclick=e=>{if(e.target.id==='picker')$('#picker').style.display='none';};
  $('#picker').style.display='flex';
}

// ---- התקנה כאפליקציה ----
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
let deferred=null;
function showInstall(){ if(standalone||LS.get('noInstall','')) return; $('#install').style.display='flex'; }
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showInstall();});
if(isIOS&&!standalone){ $('#installText').innerHTML='להתקנה: לחצו על <b>שיתוף</b> (ריבוע עם חץ למעלה) ואז <b>"הוספה למסך הבית"</b>'; $('#installBtn').hidden=true; showInstall(); }
$('#installBtn').onclick=async()=>{ if(!deferred)return; deferred.prompt(); await deferred.userChoice; deferred=null; $('#install').style.display='none'; };
$('#installX').onclick=()=>{ LS.set('noInstall','1'); $('#install').style.display='none'; };
addEventListener('appinstalled',()=>{$('#install').style.display='none';});

setTab(tab);
init().catch(e=>$('#list').innerHTML=`<div class="err">הנתונים עוד לא מוכנים – ההרצה הראשונה לוקחת כחצי שעה. (${esc(e.message)})</div>`);
</script></body></html>
